<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Presupuestos | AutoNegocio</title>
    <meta name="description" content="Contactate con el equipo de AutoNegocio. Solicitá un presupuesto para consultoría e integración de software comercial a medida.">
    <meta name="keywords" content="contacto AutoNegocio, presupuesto consultoría, automatización a medida, atención al cliente">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/logo-autonegocio.png" alt="Logotipo oficial de AutoNegocio" class="logo-header" width="150">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="menuNavegacion">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="text-center mb-5" data-aos="fade-down" data-aos-duration="800">
            <h1>Contactanos</h1>
            <p class="lead">Dejanos tu consulta y un asesor se comunicará con vos a la brevedad.</p>
        </section>

        <section class="row justify-content-center" data-aos="fade-up" data-aos-duration="1000">
            <article class="col-md-8 col-lg-6">
                <form class="p-4 border rounded shadow-sm">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre de la Empresa</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej: Industria López S.A." required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="contacto@empresa.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Detalle del Proyecto o Consulta</label>
                        <textarea class="form-control" id="mensaje" rows="4" placeholder="Contanos qué procesos buscás optimizar..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
                </form>
            </article>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">Copyright 2026 - AutoNegocio</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
