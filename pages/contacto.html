<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Presupuestos | AutoNegocio</title>
    <meta name="description" content="Contactate con AutoNegocio para solicitar un presupuesto para consultoría e integración comercial a medida.">
    <meta name="keywords" content="contacto AutoNegocio, presupuesto consultoría, automatización a medida, atención al cliente">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <!-- Favicon para la pestaña de Chrome y navegadores web -->
<link rel="icon" type="image/png" href="../assets/logo-main.png">

<!-- Ícono para pantalla de inicio en celulares (iOS / Android) -->
<link rel="apple-touch-icon" href="../assets/logo-main.png">
</head>
<body data-bs-theme="dark">
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/logo-autonegocio-white.png" alt="Logotipo de AutoNegocio" width="160">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="menuNavegacion">
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="servicios.html">Consultoría</a></li>
                        <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
                        <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                            <a class="btn w-100 disabled" href="#" style="background-color: #ff6000; color: white; font-weight: 600;">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5 min-vh-100">
        <section class="text-center mb-5" data-aos="fade-down" data-aos-duration="800">
            <h1 class="fw-bold">Hablemos de negocios</h1>
            <p class="lead" style="color: #94a3b8;">Dejanos tus datos y un especialista en sistemas se contactará en menos de 24 horas.</p>
        </section>

        <section class="row justify-content-center" data-aos="fade-up" data-aos-duration="1000">
            <article class="col-md-8 col-lg-6">
                <!-- Bootstrap 5 form con soporte dark theme -->
                <form class="p-4 p-md-5 rounded shadow-lg" style="background-color: #1e293b; border: 1px solid rgba(255,255,255,0.05);">
                    <div class="mb-4">
                        <label for="nombre" class="form-label fw-bold">Empresa o Nombre</label>
                        <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary" id="nombre" placeholder="Ej: Industria López S.A." required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">Correo Electrónico Laboral</label>
                        <input type="email" class="form-control form-control-lg bg-dark text-white border-secondary" id="email" placeholder="ceo@empresa.com" required>
                    </div>
                    <div class="mb-4">
                        <label for="mensaje" class="form-label fw-bold">¿Qué procesos buscás escalar u optimizar?</label>
                        <textarea class="form-control form-control-lg bg-dark text-white border-secondary" id="mensaje" rows="5" placeholder="Detallanos tu principal cuello de botella actual..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-lg w-100 py-3 mt-2" style="background-color: #ff6000; color: white; font-weight: bold; box-shadow: 0 4px 15px rgba(255, 96, 0, 0.4);">Enviar Solicitud</button>
                </form>
            </article>
        </section>
    </main>

    <footer class="text-center py-4 mt-5">
        <p class="mb-0">Copyright 2026 - AutoNegocio</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
